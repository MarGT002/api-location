<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi IP Pública – IPify</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
    }
    .ip-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 200, 0.3);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(0, 255, 200, 0.1);
      max-width: 480px;
      width: 100%;
    }
    .ip-label {
      color: #00ffc8;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .ip-value {
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
      min-height: 60px;
    }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #00ffc8;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
      margin-right: 8px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    .btn-refresh {
      background: transparent;
      border: 1px solid #00ffc8;
      color: #00ffc8;
      border-radius: 8px;
      padding: 0.5rem 1.5rem;
      margin-top: 1.5rem;
      transition: all 0.3s;
    }
    .btn-refresh:hover {
      background: #00ffc8;
      color: #0f2027;
    }
    .loading-text { color: #aaa; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="ip-card">
    <div class="ip-label">
      <span class="status-dot"></span>Tu IP Pública
    </div>
    <div class="ip-value" id="ip-display">
      <span class="loading-text">Consultando...</span>
    </div>
    <p class="text-secondary mt-3" style="font-size:0.78rem; letter-spacing:1px;">
      Fuente: <a href="https://www.ipify.org" target="_blank" class="text-decoration-none" style="color:#00ffc8;">api.ipify.org</a>
    </p>
    <button class="btn btn-refresh" onclick="fetchIP()">
      <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
    </button>
  </div>

  <script>
    async function fetchIP() {
      const display = document.getElementById('ip-display');
      display.innerHTML = '<span class="loading-text">Consultando...</span>';
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        if (!response.ok) throw new Error('Error en la respuesta');
        const data = await response.json();
        display.textContent = data.ip;
      } catch (error) {
        display.innerHTML = `<span style="color:#ff6b6b;font-size:1rem;">Error: ${error.message}</span>`;
      }
    }

    // Obtener IP al cargar la página
    fetchIP();
  </script>
</body>
</html>
